spring:
  config:
    activate:
      on-profile: test

  # Embedded H2 in PostgreSQL compatibility mode for unit/slice tests without Docker requirement
  datasource:
    url: jdbc:h2:mem:fbsu_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false


