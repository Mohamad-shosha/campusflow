spring:
  application:
    name: fbsu-campus-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # DataSource Configurations via Environment Variables (with fallback defaults)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fbsu_campus_db}
    username: ${SPRING_DATASOURCE_USERNAME:fbsu_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:fbsu_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      pool-name: FbsuHikariCP
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  # JPA & Hibernate Configurations
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Riyadh

  # Flyway Migration Settings
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /

# Actuator Configurations
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Springdoc OpenAPI Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
