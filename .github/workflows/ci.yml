name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'audit/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'ci/**'
      - 'test/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Frontend Verification (Formatting, Lint, Typecheck, Test, Build)
  # ============================================================================
  frontend-ci:
    name: Frontend Quality & Test Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Check Prettier Formatting
        run: npx prettier --check "src/**/*.{ts,tsx,css}"

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Frontend Production Artifact
        run: npm run build

  # ============================================================================
  # 2. Backend Verification (Java 21, ArchUnit, Testcontainers PostgreSQL, Build)
  # ============================================================================
  backend-ci:
    name: Backend Quality & Architecture Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permissions to Maven Wrapper
        run: chmod +x ./mvnw

      - name: Run Backend Architecture, Unit & PostgreSQL Integration Tests
        run: ./mvnw test

      - name: Package Backend Application JAR
        run: ./mvnw package -DskipTests

      - name: Upload Backend Application JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/fbsu-campus-backend-*.jar
          retention-days: 1

  # ============================================================================
  # 3. Docker Verification (Full-Stack Compose Build, Health & Live Smoke Test)
  # ============================================================================
  docker-smoke-ci:
    name: Docker Build & Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Download Backend Application JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build & Boot Full-Stack Containers (PostgreSQL, Backend, Frontend)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          docker compose ps

      - name: Execute Live HTTP End-to-End Smoke Verification
        run: |
          curl -fsS http://localhost:8080/actuator/health | grep '"status":"UP"'
          curl -fsS http://localhost/api/v1/parking/summary | grep '"totalSpots":40'
          curl -fsS http://localhost/ | grep -i '<!doctype html>'

      - name: Tear Down Smoke Stack
        if: always()
        run: docker compose down

