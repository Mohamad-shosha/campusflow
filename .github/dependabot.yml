version: 2
updates:
  # Maintain dependencies for npm in frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # Maintain dependencies for root (legacy tools)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # Maintain dependencies for Maven in backend
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
